# This configuration was generated with the setup-qlty-toml skill.
# For reference: https://docs.qlty.sh/qlty-toml
config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/__pycache__/**",
  "**/.tox/**",
  "**/.venv/**",
  "**/venv/**",
  "**/eggs/**",
  "**/*.egg-info/**",
  "docs/_build/**",
]

test_patterns = [
  "**/tests/**",
  "**/test/**",
  "**/*_test.py",
  "**/test_*.py",
  "**/conftest.py",
]

[smells]
mode = "comment"

# REQUIRED — points to the built-in Qlty plugin registry. Do not omit this block.
[[source]]
name = "default"
default = true

# Language linters
[[plugin]]
name = "ruff"
mode = "comment"

[[plugin]]
name = "mypy"
mode = "comment"

# Security scanners
[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "osv-scanner"
mode = "block"

[[plugin]]
name = "bandit"
mode = "block"

# Cross-language / infra tools
[[plugin]]
name = "actionlint"
mode = "comment"

[[plugin]]
name = "yamllint"
mode = "comment"

[[plugin]]
name = "zizmor"
mode = "block"

[[plugin]]
name = "markdownlint"
mode = "comment"
